{% extends "base.html" %}

{% block body %}
{% include "message.html" %}

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="row shadow-lg rounded-4 overflow-hidden" style="max-width: 900px; width: 100%;">
        <!-- Image Section -->
        <div class="col-md-6 d-none d-md-block p-0">
            <img src="https://img.freepik.com/free-vector/my-password-concept-illustration_114360-4294.jpg?t=st=1743219719~exp=1743223319~hmac=d2e044e1c295e539a424fb931325912c57948b94a0b8ee27c7328ce3b749d0fe&w=740" 
                 alt="Login Illustration" 
                 class="img-fluid h-100" 
                 style="object-fit: cover;">
        </div>

        <!-- Login Form Section -->
        <div class="col-md-6 bg-white p-4">
            <div class="text-center">
                <h4 class="fw-bold text-primary">Welcome Back!</h4>
                <p class="text-muted">Login to continue</p>
            </div>
            <form action="" method="post" class="form-group">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg rounded-3">Login</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'password_reset' %}" class="text-decoration-none">Forgot Password?</a>
            </div>
        </div>
    </div>
</div>

{% endblock body %}
